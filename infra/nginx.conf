# 前端容器（nginx）配置：托管 SPA 静态产物 + 反代 /api 到 api 服务。
#
# 两个要点：
# 1. 前端路由使用 history 模式，未知路径必须回退到 index.html，否则刷新会 404。
# 2. 后端对写操作做 Origin 校验（apps/api/src/main.ts），因此反代必须**原样透传 Origin**，
#    并且 compose 里的 APP_ORIGIN 要等于浏览器访问前端的地址（默认 http://localhost:8080）。
server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    # Up to ten 50 MiB files plus multipart metadata. Per-file limits are enforced by API.
    client_max_body_size 501m;
    # Resolve the Compose service dynamically; API container recreation changes
    # its IP and must not leave nginx proxying a stale address (502).
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
